<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">Notebook dan pulpen untuk mahasiswa kedokteran</title>
  <desc id="desc">Ilustrasi notebook bergaris dan pulpen dengan bentuk sederhana dan warna biru lembut.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dceaff"/>
      <stop offset="1" stop-color="#b8d3ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5d8fd1" flood-opacity=".16"/>
    </filter>
  </defs>

  <circle cx="90" cy="115" r="76" fill="#edf4ff"/>
  <circle cx="126" cy="226" r="54" fill="#f4efff"/>
  <path d="M42 250 C110 213 165 210 236 241" fill="none" stroke="#c4dcff" stroke-width="2"/>
  <path d="M306 74 C355 54 413 52 462 71" fill="none" stroke="#d1e3ff" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(68 86) rotate(-12 115 92)" filter="url(#shadow)">
    <rect x="24" y="14" width="176" height="164" rx="12" fill="#cbdcff"/>
    <rect x="14" y="2" width="176" height="164" rx="12" fill="url(#paper)" stroke="#aec8f1" stroke-width="2"/>
    <path d="M28 26 H172 M28 48 H172 M28 70 H172 M28 92 H172 M28 114 H146" stroke="#9fb7db" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M42 12 V153" stroke="#e3a4b5" stroke-width="3" opacity=".55"/>
    <rect x="142" y="18" width="26" height="16" rx="8" fill="#edf4ff"/>
  </g>

  <g transform="translate(218 42) rotate(16 60 118)" filter="url(#shadow)">
    <rect x="46" y="16" width="22" height="190" rx="11" fill="#195fdb"/>
    <rect x="50" y="12" width="14" height="168" rx="7" fill="#5ba2ff"/>
    <rect x="53" y="18" width="8" height="155" rx="4" fill="#dbeeff" opacity=".9"/>
    <path d="M49 180 L57 214 L65 180 Z" fill="#2b63b3"/>
    <rect x="44" y="4" width="26" height="20" rx="8" fill="#2e6fe2"/>
    <path d="M44 10 L36 18" stroke="#2e6fe2" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(350 42)">
    <circle cx="48" cy="38" r="6" fill="#8eb8ff"/>
    <circle cx="80" cy="22" r="4" fill="#b8d3ff"/>
    <path d="M10 104 C22 92 34 92 46 104" fill="none" stroke="#d2e2ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M124 132 C142 116 158 114 178 126" fill="none" stroke="#d9cfff" stroke-width="3" stroke-linecap="round"/>
    <path d="M148 50 v24 m-12 -12 h24" stroke="#9ac0ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(356 212)">
    <path d="M0 20 h56" stroke="#dbe8ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 38 h38" stroke="#e2dbff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="86" cy="26" r="18" fill="#e5f0ff"/>
    <path d="M78 26 l6 6 11 -13" fill="none" stroke="#4b8de8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>