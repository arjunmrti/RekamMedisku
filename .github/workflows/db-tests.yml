name: Database Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-isolation:
    name: Tenant isolation pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Build isolated tenant test project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .ci/tenant-isolation-supabase
          mkdir -p .ci/tenant-isolation-supabase
          cd .ci/tenant-isolation-supabase

          supabase init
          mkdir -p supabase/migrations supabase/tests/database

          cp "$GITHUB_WORKSPACE/supabase/tests/fixtures/mu005_tenant_isolation_schema.sql" \
            supabase/migrations/00000000000000_mu005_tenant_fixture.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260926212923_p3_attachment_storage_sync.sql" \
            supabase/migrations/20260926212923_p3_attachment_storage_sync.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260928_phase0_multi_user_database_foundation.sql" \
            supabase/migrations/20260928_phase0_multi_user_database_foundation.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260928_mu101_follow_up_template_engine.sql" \
            supabase/migrations/20260928_mu101_follow_up_template_engine.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/phase0_multi_user_foundation.test.sql" \
            supabase/tests/database/phase0_multi_user_foundation.test.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/mu005_cross_user_isolation.test.sql" \
            supabase/tests/database/mu005_cross_user_isolation.test.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/mu101_follow_up_template_engine.test.sql" \
            supabase/tests/database/mu101_follow_up_template_engine.test.sql

      - name: Start Supabase database
        working-directory: .ci/tenant-isolation-supabase
        shell: bash
        run: |
          set -euo pipefail
          start_ok=false
          for attempt in 1 2 3; do
            echo "Starting Supabase (attempt $attempt/3)..."
            if supabase start; then
              start_ok=true
              break
            fi
            echo "Supabase start failed; retrying after cleanup..."
            supabase stop || true
            sleep $((attempt * 30))
          done

          if [ "$start_ok" != "true" ]; then
            echo "Supabase could not be started after 3 attempts."
            exit 1
          fi

          supabase status -o env > supabase.env
          awk -F= '
            $1 ~ /^(API_URL|ANON_KEY|JWT_SECRET)$/ {
              value = $0
              sub(/^[^=]*=/, "", value)
              gsub(/^"|"$//, "", value)
              print $1 "=" value
            }
          ' supabase.env > mu005.env
          test "$(wc -l < mu005.env)" -eq 3
          cat mu005.env >> "$GITHUB_ENV"
          rm -f supabase.env mu005.env

      - name: Reset database from fixture + production tenant migrations
        working-directory: .ci/tenant-isolation-supabase
        run: supabase db reset --no-seed

      - name: Run Storage API tenant-boundary test
        run: node "$GITHUB_WORKSPACE/scripts/mu005-storage-isolation.mjs"

      - name: Run tenant-boundary pgTAP suite
        working-directory: .ci/tenant-isolation-supabase
        run: supabase test db

      - name: Stop Supabase
        if: always()
        working-directory: .ci/tenant-isolation-supabase
        run: supabase stop
