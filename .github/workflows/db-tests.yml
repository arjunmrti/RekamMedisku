name: Database Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-isolation:
    name: Tenant isolation pgTAP
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        shell: pwsh
        run: npm install --no-save --no-package-lock supabase@2.117.0

      - name: Verify Supabase CLI
        shell: pwsh
        run: npx --no-install supabase --version

      - name: Build isolated tenant test project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .ci/tenant-isolation-supabase
          mkdir -p .ci/tenant-isolation-supabase
          cd .ci/tenant-isolation-supabase

          npx --no-install supabase init
          mkdir -p supabase/migrations supabase/tests/database

          cp "$GITHUB_WORKSPACE/supabase/tests/database/phase0_multi_user_foundation.test.sql" \
            supabase/tests/database/phase0_multi_user_foundation.test.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/mu005_cross_user_isolation.test.sql" \
            supabase/tests/database/mu005_cross_user_isolation.test.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/mu101_follow_up_template_engine.test.sql" \
            supabase/tests/database/mu101_follow_up_template_engine.test.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/mu102_follow_up_template_persistence.test.sql" \
            supabase/tests/database/mu102_follow_up_template_persistence.test.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/mu103_rotation_template_binding.test.sql" \
            supabase/tests/database/mu103_rotation_template_binding.test.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/mu104_dynamic_follow_up_answers.test.sql" \
            supabase/tests/database/mu104_dynamic_follow_up_answers.test.sql

          cp "$GITHUB_WORKSPACE/supabase/tests/database/mu105_report_template_engine.test.sql" \
            supabase/tests/database/mu105_report_template_engine.test.sql

      - name: Validate PR migration filenames
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          changed_migrations="$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'supabase/migrations/*.sql' || true)"
          if [ -z "$changed_migrations" ]; then
            echo "No migration files changed in this PR."
            exit 0
          fi

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            name="$(basename "$file")"
            version="${name%%_*}"
            if [[ ! "$version" =~ ^[0-9]{14}$ ]]; then
              echo "Invalid migration filename: $file"
              echo "New migration files must start with a 14-digit timestamp (YYYYMMDDHHMMSS)."
              exit 1
            fi
          done <<< "$changed_migrations"

      - name: Start Supabase database
        working-directory: .ci/tenant-isolation-supabase
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Starting Supabase database (attempt $attempt/3)..."
            if npx --no-install supabase db start --debug; then
              exit 0
            fi
            echo "Supabase database bootstrap failed; retrying..."
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            npx --no-install supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          echo "Supabase database could not be bootstrapped after 3 attempts."
          exit 1

      - name: Install database test migrations
        working-directory: .ci/tenant-isolation-supabase
        shell: bash
        run: |
          set -euo pipefail

          cp "$GITHUB_WORKSPACE/supabase/tests/fixtures/mu005_tenant_isolation_schema.sql" \
            supabase/migrations/00000000000000_mu005_tenant_fixture.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260928_phase0_multi_user_database_foundation.sql" \
            supabase/migrations/20260928_phase0_multi_user_database_foundation.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260928140000_mu101_follow_up_template_engine.sql" \
            supabase/migrations/20260928140000_mu101_follow_up_template_engine.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260927_p4_atomic_follow_up_save.sql" \
            supabase/migrations/20260927_p4_atomic_follow_up_save.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260928150000_mu102_follow_up_template_persistence.sql" \
            supabase/migrations/20260928150000_mu102_follow_up_template_persistence.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260928160000_mu103_rotation_template_binding.sql" \
            supabase/migrations/20260928160000_mu103_rotation_template_binding.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260928170000_mu104_dynamic_follow_up_answers.sql" \
            supabase/migrations/20260928170000_mu104_dynamic_follow_up_answers.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260929000000_mu105_report_template_engine.sql" \
            supabase/migrations/20260929000000_mu105_report_template_engine.sql

          cp "$GITHUB_WORKSPACE/supabase/migrations/20260926212923_p3_attachment_storage_sync.sql" \
            supabase/migrations/20260926212923_p3_attachment_storage_sync.sql

          declare -A seen_versions=()
          for file in supabase/migrations/*.sql; do
            name="$(basename "$file")"
            version="${name%%_*}"
            if [[ -n "${seen_versions[$version]:-}" ]]; then
              echo "Duplicate migration version detected: $version"
              echo "  - ${seen_versions[$version]}"
              echo "  - $file"
              exit 1
            fi
            seen_versions[$version]="$file"
          done

      - name: Reset database and apply test migrations
        working-directory: .ci/tenant-isolation-supabase
        run: npx --no-install supabase db reset --no-seed

      - name: Run tenant-boundary pgTAP suite
        working-directory: .ci/tenant-isolation-supabase
        run: npx --no-install supabase test db

      - name: Stop Supabase
        if: always()
        working-directory: .ci/tenant-isolation-supabase
        run: npx --no-install supabase stop
